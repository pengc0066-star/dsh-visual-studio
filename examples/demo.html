<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Visual Studio Demo</title>
  <style>
    :root { --brand: #5b8def; --muted: #6b7280; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #f4f5f7; color: #1f232c; }
    .page { max-width: 720px; margin: 0 auto; padding: 32px 20px; }
    .hero { padding: 28px; border-radius: 12px; background: #fff; box-shadow: 0 2px 12px rgb(0 0 0 / 8%); }
    .hero h1 { margin: 0 0 8px; font-size: 24px; color: var(--brand); }
    .hero p { margin: 0 0 20px; color: var(--muted); }
    .card { display: flex; gap: 16px; align-items: center; padding: 16px; margin-top: 16px; border: 1px solid #e5e7eb; border-radius: 10px; background: #fff; }
    .avatar { width: 48px; height: 48px; border-radius: 50%; background: var(--brand); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; }
    .btn { display: inline-block; padding: 10px 18px; border: none; border-radius: 8px; background: var(--brand); color: #fff; cursor: pointer; font-size: 14px; }
    .badge { padding: 4px 10px; border-radius: 999px; background: #eef2ff; color: #4f46e5; font-size: 12px; }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero" id="hero">
      <h1>你好，HTML Studio</h1>
      <p>点击“元素检查”后在预览中点击任意元素，即可查看选择器与样式。</p>
      <button class="btn" id="primary-action">主要操作</button>
    </section>
    <section class="card" id="card">
      <div class="avatar">A</div>
      <div>
        <div class="badge">示例</div>
        <p>这是一段用于演示元素检查的卡片文本。</p>
      </div>
    </section>
  </main>
</body>
</html>
